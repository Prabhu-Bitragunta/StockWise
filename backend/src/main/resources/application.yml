spring:
  application:
    name: stockwise
  ai:
    openai:
      # Spring AI's OpenAI-compatible client can target Gemini or OpenAI.
      api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        options:
          model: ${AI_MODEL:gemini-3.5-flash-lite}
          temperature: 0.2
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/supply_chain_mgmt}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  address: 0.0.0.0
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
